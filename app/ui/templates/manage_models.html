<!DOCTYPE html>
<html>
<head>
    <title>Manage Models - Cobalt</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Cobalt AI chat interface - Model management">
    
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cobalt">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    
    <!-- Android Chrome Web App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Cobalt">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1 id="app-title">Manage models - {{MODEL_NAME}}</h1>
        <div class="nav-links">
            <a href="/">Back to chat</a>
        </div>
        <div class="model-bar">
            <select id="model-select" onchange="selectModel(this.value)"></select>
            <button id="pull-selected-model-button" onclick="pullSelectedModel()">Pull selected</button>
            <input type="text" id="custom-model-input" placeholder="Type model to pull (e.g. llama3.1:8b)">
            <button id="pull-custom-model-button" onclick="pullCustomModel()">Pull typed model</button>
        </div>
        <div id="pull-status" class="status hidden"></div>
        <div id="messages"></div>
    </div>
    <script src="/static/manage-models.js"></script>
</body>
</html>
