<!DOCTYPE html>
<html>
<head>
    <title>Cobalt Settings</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Cobalt AI chat interface - Settings">
    
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cobalt">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    
    <!-- Android Chrome Web App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Cobalt">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Cobalt Settings</h1>
        <div class="nav-links">
            <a href="/">Back to chat</a>
            <a href="/models/manage">Manage models</a>
        </div>
        <label for="keep-alive-input">Ollama keep_alive</label>
        <input id="keep-alive-input" type="text" placeholder="e.g. 5m or 0">
        <button onclick="saveSettings()">Save</button>
        <p id="settings-status" class="status"></p>
    </div>
    <script src="/static/settings.js"></script>
</body>
</html>
