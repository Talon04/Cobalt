<!DOCTYPE html>
<html>
<head>
    <title>Cobalt</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Cobalt AI chat interface">
    
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cobalt">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
    
    <!-- Android Chrome Web App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Cobalt">
    
    <!-- Microsoft tiles (optional fallback) -->
    <meta name="msapplication-TileColor" content="#111827">
    <meta name="msapplication-config" content="/browserconfig.xml">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="stylesheet" href="/static/vendor/katex.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1 id="app-title">Cobalt - {{MODEL_NAME}}</h1>
        <div class="nav-links">
            <a href="/models/manage">Manage models</a>
            <a href="/settings">Settings</a>
        </div>
        <div class="chat-bar">
            <select id="chat-select" onchange="switchChat(this.value)"></select>
            <button id="rename-chat-button" onclick="renameCurrentChat()">Rename chat</button>
        </div>
        <div class="model-bar">
            <select id="model-select" onchange="selectModel(this.value)"></select>
        </div>
        <div id="chat"></div>
        <div class="input-row">
            <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off">
            <button id="send-button" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/vendor/katex.min.js"></script>
    <script src="/static/vendor/katex-auto-render.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
