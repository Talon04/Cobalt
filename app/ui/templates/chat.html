<!DOCTYPE html>
<html>
<head>
    <title>Cobalt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1 id="app-title">Cobalt - {{MODEL_NAME}}</h1>
        <div class="nav-links">
            <a href="/models/manage">Manage models</a>
            <a href="/settings">Settings</a>
        </div>
        <div class="chat-bar">
            <select id="chat-select" onchange="switchChat(this.value)"></select>
            <button id="rename-chat-button" onclick="renameCurrentChat()">Rename chat</button>
        </div>
        <div class="model-bar">
            <select id="model-select" onchange="selectModel(this.value)"></select>
        </div>
        <div id="chat"></div>
        <div class="input-row">
            <input type="text" id="input" placeholder="Ask me anything..." autocomplete="off">
            <button id="send-button" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
